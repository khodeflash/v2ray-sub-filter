name: Update subscriptions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static filter tests
        run: python -m unittest tests.test_filter -v

      - name: Update filtered and unfiltered subscriptions
        run: python scripts/update_subscriptions.py

      - name: Show summary
        run: |
          set -euo pipefail

          echo "Filtered subscriptions:"
          find subscriptions \
            -maxdepth 1 \
            -type f \
            -name "*.txt" \
            -print \
            -exec wc -l {} \;

          echo
          echo "Unfiltered renamed subscriptions:"
          find subscriptions_unfiltered \
            -maxdepth 1 \
            -type f \
            -name "*.txt" \
            -print \
            -exec wc -l {} \;

          echo
          echo "Static filter report:"
          cat reports/latest.json

      - name: Commit static subscription changes
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            subscriptions \
            subscriptions_unfiltered \
            reports/latest.json

          if git diff --cached --quiet; then
            echo "No static subscription changes to commit."
            exit 0
          fi

          git commit -m "Update subscriptions"
          git push
